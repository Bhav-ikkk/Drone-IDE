<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <rect width="512" height="512" rx="64" fill="#0a0a1a"/>
  <g transform="translate(256,256)">
    <!-- drone frame cross -->
    <rect x="-160" y="-8" width="320" height="16" rx="4" fill="#00f7ff" opacity="0.8"/>
    <rect x="-8" y="-160" width="16" height="320" rx="4" fill="#00f7ff" opacity="0.8"/>
    <!-- center -->
    <circle cx="0" cy="0" r="30" fill="#0066ff" stroke="#00f7ff" stroke-width="3"/>
    <!-- propellers -->
    <circle cx="-130" cy="-130" r="50" fill="none" stroke="#00f7ff" stroke-width="2" opacity="0.5"/>
    <circle cx="130" cy="-130" r="50" fill="none" stroke="#00f7ff" stroke-width="2" opacity="0.5"/>
    <circle cx="-130" cy="130" r="50" fill="none" stroke="#00f7ff" stroke-width="2" opacity="0.5"/>
    <circle cx="130" cy="130" r="50" fill="none" stroke="#00f7ff" stroke-width="2" opacity="0.5"/>
    <!-- motors -->
    <circle cx="-130" cy="-130" r="14" fill="#00d4ff"/>
    <circle cx="130" cy="-130" r="14" fill="#00d4ff"/>
    <circle cx="-130" cy="130" r="14" fill="#00d4ff"/>
    <circle cx="130" cy="130" r="14" fill="#00d4ff"/>
  </g>
  <text x="256" y="440" text-anchor="middle" fill="#00f7ff" font-family="Arial,sans-serif" font-size="42" font-weight="bold" letter-spacing="4">DRONE IDE</text>
</svg>
